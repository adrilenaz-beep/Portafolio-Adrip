<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Obra de Adriano Lenaz Zenteno. Proyectos artísticos, intervención, serie y fotografía. ADRIP, Cochabamba, Bolivia.">
<meta property="og:title" content="ADRIANO LENAZ — OBRA">
<meta property="og:description" content="Proyectos artísticos. Intervención, serie y fotografía desde Cochabamba.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://adrilenaz-beep.github.io/Portafolio-Adrip/obra.html">
<title>ADRIANO LENAZ — OBRA</title>
<link rel="canonical" href="https://adrilenaz-beep.github.io/Portafolio-Adrip/obra.html">
<link rel="icon" type="image/svg+xml" href="https://res.cloudinary.com/dmvmqykud/image/upload/v1775351852/1AdripSVG_oijqbk.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300&family=IBM+Plex+Sans:wght@300;400;500&display=swap">
<style>
:root{
  --vacio:#080809;
  --tinta:#efece5;
  --tinta-media:#8e8b84;
  --tinta-baja:#54524c;
  --linea:#22222a;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --sans:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--vacio); color:var(--tinta);
  font-family:var(--mono); overflow:hidden;
}
body.leyendo{overflow:auto}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--tinta);outline-offset:4px}

/* ── el velo que borra lo anterior ── */
#velo{
  position:fixed; inset:0; z-index:200; background:var(--tinta);
  transform-origin:top;
  animation: borrar 1.15s cubic-bezier(.76,0,.24,1) .15s forwards;
}
@keyframes borrar{
  0%   { transform:scaleY(1); }
  100% { transform:scaleY(0); }
}
#velo::after{
  content:'OBRA';
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  font-family:var(--mono); font-size:13px; letter-spacing:.7em;
  color:var(--vacio); animation: irse .5s ease forwards;
}
@keyframes irse{ to{ opacity:0 } }

/* ── chrome ── */
.tope, .pie{
  position:fixed; left:0; right:0; z-index:60;
  display:flex; align-items:center; gap:18px;
  padding:20px 26px; font-family:var(--mono); font-size:10px;
  letter-spacing:.2em; text-transform:uppercase; color:var(--tinta-baja);
  opacity:0; animation: aparecer .8s ease 1.15s forwards;
}
.tope{top:0} .pie{bottom:0}
.tope a:hover, .pie a:hover{color:var(--tinta)}
.crece{flex:1}
@keyframes aparecer{ to{ opacity:1 } }

/* ── el espacio ── */
#espacio{
  position:relative; width:100%; height:100vh;
  perspective:900px; overflow:hidden;
}
#campo{
  position:absolute; inset:0;
  transition: transform .9s cubic-bezier(.2,.8,.3,1);
  will-change:transform;
}

.proy{
  position:absolute; display:block; cursor:pointer;
  transform:translate(-50%,-50%) scale(var(--z));
  opacity:0;
  animation: llegar 1.5s cubic-bezier(.16,1,.3,1) forwards;
}
@keyframes llegar{
  0%   { opacity:0; transform:translate(-50%,-50%) scale(calc(var(--z) * 2.4)); filter:blur(14px); }
  100% { opacity:1; transform:translate(-50%,-50%) scale(var(--z)); filter:blur(0); }
}
.proy-tit{
  position:relative; z-index:2; display:block;
  font-family:var(--mono);
  font-size:clamp(26px, 4.6vw, 58px); font-weight:700;
  letter-spacing:-.03em; line-height:.95; white-space:nowrap;
  color:var(--tinta); transition:letter-spacing .4s;
}
.proy-meta{
  position:relative; z-index:2; display:block; margin-top:9px;
  font-family:var(--mono); font-size:9px; letter-spacing:.22em;
  text-transform:uppercase; color:var(--tinta-baja); transition:color .4s;
  text-shadow:0 0 14px rgba(8,8,9,.95);
}
.proy-linea{
  position:relative; z-index:2; display:block; margin-top:4px;
  font-family:var(--sans); font-size:11.5px; font-weight:300; color:transparent;
  max-width:30ch; transition:color .5s; line-height:1.5;
}
.proy:hover .proy-linea, .proy:focus-visible .proy-linea{color:var(--tinta-media)}
.proy:hover .proy-tit, .proy:focus-visible .proy-tit{letter-spacing:.005em}
.proy:hover .proy-meta{color:var(--c1)}

/* ── la firma vive DENTRO de la letra, no detrás ── */
.firma{
  position:absolute; z-index:1; pointer-events:none;
  left:50%; top:44%; transform:translate(-50%,-50%);
  width:150%; height:260%;
  opacity:.34; transition:opacity .5s, transform .7s cubic-bezier(.2,.8,.3,1);
}
.proy:hover .firma{opacity:.55; transform:translate(-50%,-50%) scale(1.14)}

/* el patrón que se mete en las letras */
.proy-tit{
  background-clip:text; -webkit-background-clip:text;
  background-repeat:no-repeat;
  transition:letter-spacing .4s, filter .45s, background-size .6s, background-position .6s;
}

/* ROSAS · las espinas crecen dentro de la palabra */
[data-efecto="bloom"] .proy-tit{
  color:transparent;
  background-image:
    radial-gradient(circle at 18% 68%, var(--c2) 0 5%, transparent 5.5%),
    radial-gradient(circle at 52% 26%, var(--c2) 0 4%, transparent 4.5%),
    radial-gradient(circle at 84% 62%, var(--c2) 0 4.5%, transparent 5%),
    linear-gradient(104deg, var(--c1) 0%, var(--c1) 46%, var(--c3) 47%, var(--c1) 54%, var(--c1) 100%);
  background-size:100% 100%;
  filter:drop-shadow(0 0 22px rgba(63,145,71,.28));
}
[data-efecto="bloom"]:hover .proy-tit{ filter:drop-shadow(0 0 30px rgba(214,58,47,.5)); }
.ascii{
  position:absolute; z-index:0; left:-6%; top:50%;
  transform:translateY(-50%) scale(.72); transform-origin:left center;
  font-family:var(--mono); font-size:9px; line-height:1.02; white-space:pre;
  color:var(--c1); opacity:0; letter-spacing:.06em;
  transition:opacity .75s ease, transform .95s cubic-bezier(.16,1,.3,1);
  pointer-events:none; text-shadow:0 0 12px rgba(8,8,9,.9);
}
.proy:hover .ascii{ opacity:.5; transform:translateY(-50%) scale(1); }

/* PASAMONTAÑAS · la lana tejida, y la franja de los ojos */
[data-efecto="resplandor"] .proy-tit{
  color:transparent;
  background-image:repeating-linear-gradient(88deg,
    var(--c1) 0 3px, #b52d74 3px 5px, var(--c1) 5px 8px);
  filter:drop-shadow(0 0 26px rgba(232,64,154,.42));
}
[data-efecto="resplandor"] .proy-tit::after{
  content:''; position:absolute; left:-2%; right:-2%; top:41%; height:15%;
  background:var(--vacio); mix-blend-mode:normal;
  transition:transform .5s cubic-bezier(.2,.8,.3,1);
}
[data-efecto="resplandor"]:hover .proy-tit::after{ transform:scaleY(.18); }

/* ROOM G · un haz de luz barre las letras */
[data-efecto="luces"] .proy-tit{
  color:transparent;
  background-image:linear-gradient(101deg,
    #5d5d58 0%, #5d5d58 28%, var(--c1) 40%, #f2efe9 50%, var(--c2) 60%, #5d5d58 72%, #5d5d58 100%);
  background-size:230% 100%; background-position:62% 0;
  filter:drop-shadow(0 0 18px rgba(46,230,168,.22));
}
[data-efecto="luces"]:hover .proy-tit{ background-position:4% 0; filter:drop-shadow(0 0 26px rgba(255,59,48,.4)); }

/* MARTADERO · trama de aerosol dentro del tipo */
[data-efecto="trama"] .proy-tit{
  color:transparent;
  background-image:
    radial-gradient(circle, var(--c1) .9px, transparent 1.15px),
    radial-gradient(circle, var(--c2) .8px, transparent 1.05px),
    radial-gradient(circle, var(--c3, var(--c1)) .7px, transparent .95px),
    linear-gradient(97deg, var(--c1) 0%, var(--c3) 38%, var(--c2) 72%, var(--c1) 100%);
  background-size:6px 6px, 9px 9px, 13px 13px, 100% 100%;
  background-position:0 0, 3px 4px, 6px 2px, 0 0;
  filter:drop-shadow(0 0 16px rgba(43,111,214,.3));
}
[data-efecto="trama"]:hover .proy-tit{ background-size:4px 4px, 6px 6px, 9px 9px, 100% 100%; }

/* COWBOYS · el desfase de registro, el que ya le gustaba */
[data-efecto="desfase"] .firma{ display:none }
[data-efecto="desfase"] .proy-tit{
  text-shadow: -.055em 0 0 var(--c1), .055em 0 0 var(--c2);
  transition:text-shadow .45s, letter-spacing .4s;
}
[data-efecto="desfase"]:hover .proy-tit{ text-shadow: -.13em 0 0 var(--c1), .13em 0 0 var(--c2); }

/* TIWANAKU · el horizonte cruza las letras */
[data-efecto="banda"] .proy-tit{
  color:transparent;
  background-image:linear-gradient(180deg,
    var(--c2) 0%, var(--c2) 44%, #efece5 47%, #efece5 53%, var(--c1) 56%, var(--c1) 100%);
  filter:drop-shadow(0 0 18px rgba(201,162,39,.26));
}
[data-efecto="banda"]:hover .proy-tit{
  background-image:linear-gradient(180deg,
    var(--c2) 0%, var(--c2) 30%, #efece5 40%, #efece5 60%, var(--c1) 70%, var(--c1) 100%);
}

/* GOTAS · letrero de neón */
[data-efecto="gota"] .proy-tit{
  color:#f4fbfd;
  text-shadow:
    0 0 4px #fff,
    0 0 11px var(--c1),
    0 0 24px var(--c1),
    0 0 44px var(--c2),
    0 0 78px var(--c2);
  animation: parpadeo 6.5s infinite steps(1);
}
@keyframes parpadeo{
  0%,88%,100%{ opacity:1 }
  89%{ opacity:.35 } 90%{ opacity:1 } 93%{ opacity:.5 } 94%{ opacity:1 }
}
[data-efecto="gota"]:hover .proy-tit{
  text-shadow:
    0 0 5px #fff, 0 0 14px var(--c1), 0 0 32px var(--c1),
    0 0 58px var(--c2), 0 0 104px var(--c2);
  animation:none;
}

.proy.cerrado .proy-tit{opacity:.82}
.proy.cerrado .firma{opacity:.22}
.proy.cerrado .proy-meta::after{content:' · pronto'; color:var(--tinta-baja)}

/* ── la lectura de un proyecto ── */
#lectura{
  position:fixed; inset:0; z-index:120; overflow-y:auto;
  background:var(--vacio); opacity:0; pointer-events:none;
  transition:opacity .5s;
}
#lectura.abierta{opacity:1; pointer-events:auto}
.l-cerrar{
  position:fixed; top:18px; right:22px; z-index:130;
  font-family:var(--mono); font-size:10px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--tinta-media);
  background:var(--vacio); border:1px solid var(--linea);
  padding:9px 15px; cursor:pointer;
}
.l-cerrar:hover{color:var(--tinta)}
.l-cab{
  min-height:62vh; display:flex; flex-direction:column; justify-content:flex-end;
  padding:0 7vw 5vh; position:relative; overflow:hidden;
}
.l-cab::before{
  content:''; position:absolute; inset:0; z-index:0;
  background:radial-gradient(60% 70% at 26% 40%, var(--c1) 0%, transparent 70%),
             radial-gradient(48% 58% at 74% 62%, var(--c2) 0%, transparent 70%);
  opacity:.34; filter:blur(58px);
}
.l-cab > *{position:relative; z-index:1}
.l-anio{font-family:var(--mono); font-size:10px; letter-spacing:.3em; color:var(--tinta-media); margin-bottom:14px}
.l-tit{font-family:var(--mono); font-size:clamp(38px, 8vw, 112px); font-weight:700; letter-spacing:-.04em; line-height:.9; margin:0}
.l-linea{font-family:var(--sans); font-size:clamp(14px,1.7vw,19px); font-weight:300; color:var(--tinta-media); margin:18px 0 0; max-width:44ch}
.l-texto{
  padding:6vh 7vw 4vh; max-width:66ch; font-family:var(--sans);
  font-size:15px; font-weight:300; line-height:1.85; color:var(--tinta-media);
}
.l-paleta{display:flex; gap:0; padding:0 7vw 6vh}
.l-paleta i{width:56px; height:56px; display:block}

.l-etapa{padding:0 7vw 7vh}
.l-etapa h2{
  font-family:var(--mono); font-size:10px; letter-spacing:.28em; text-transform:uppercase;
  color:var(--tinta-media); margin:0 0 18px; display:flex; align-items:center; gap:14px;
}
.l-etapa h2::after{content:''; flex:1; height:1px; background:var(--linea)}
.l-imgs{columns:2; column-gap:10px}
.l-imgs img{width:100%; height:auto; display:block; background:#111; cursor:zoom-in;
  margin:0 0 10px; break-inside:avoid}
@media (min-width:1400px){ .l-imgs{columns:3} }
.l-pie{padding:0 7vw 12vh; font-family:var(--mono); font-size:10px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--tinta-baja)}

/* ── visor de imagen ── */
#visor{position:fixed; inset:0; z-index:180; background:rgba(4,4,5,.95);
  display:none; align-items:center; justify-content:center; padding:4vh 4vw}
#visor.abierto{display:flex}
#visor img{max-width:100%; max-height:92vh; object-fit:contain}

@media (prefers-reduced-motion: reduce){
  #velo{display:none}
  .proy, .tope, .pie{animation:none !important; opacity:1}
  *{transition:none !important}
}
@media (max-width: 760px){
  body{overflow:auto}
  #espacio{height:auto; min-height:100vh; padding:88px 20px 96px; perspective:none}
  #campo{position:static; transform:none !important}
  .proy{position:static; transform:none !important; margin:0 0 42px; animation:none; opacity:1}
  .proy-tit{white-space:normal; font-size:34px}
  .proy-linea{color:var(--tinta-media)}
  .firma{width:60%; height:120%; top:50%; left:22%}
  .l-imgs{columns:1}
}
</style>
</head>
<body>

<div id="velo"></div>

<div class="tope">
  <span>Adriano Lenaz Zenteno</span>
  <span class="crece"></span>
  <span id="cuenta"></span>
</div>

<div id="espacio">
  <div id="campo"></div>
</div>

<div class="pie">
  <a href="./">← Escritorio</a>
  <span class="crece"></span>
  <span>Obra · Cochabamba</span>
</div>

<div id="lectura" aria-hidden="true">
  <button class="l-cerrar" id="l-cerrar">✕ Volver</button>
  <div id="l-cuerpo"></div>
</div>

<div id="visor"><img id="visor-img" alt=""></div>

<script src="proyectos.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var campo = $('#campo');


  // el patrón de rosas en ascii, el mismo motivo del pliego
  var ROSA = [
    "  .-^-.  ",
    " /(@@@)\ ",
    "| (@*@) |",
    " \'-.-'/ ",
    "  \\|//  ",
    "  -\|/-  ",
    "   \|/   ",
    "  --+--  ",
    "   /|\   "
  ];
  function tejerRosas(filas, cols) {
    var out = [];
    for (var f = 0; f < filas; f++) {
      for (var l = 0; l < ROSA.length; l++) {
        var linea = '';
        for (var c = 0; c < cols; c++) {
          // filas impares corridas, como el patrón de medio ladrillo
          linea += (f % 2 ? '    ' : '') + ROSA[l];
        }
        out.push(linea);
      }
    }
    return out.join('\n');
  }

  function visibles() {
    return PROYECTOS.filter(function (p) { return !p.oculto || p.revelado; });
  }

  function pintarCampo() {
    campo.textContent = '';
    var lista = visibles();
    lista.forEach(function (p, i) {
      var a = document.createElement('a');
      a.className = 'proy' + (p.abierto ? '' : ' cerrado');
      a.href = p.abierto ? '#' + p.id : '#';
      a.dataset.efecto = p.efecto;
      a.dataset.id = p.id;
      a.style.left = p.pos.x + '%';
      a.style.top = p.pos.y + '%';
      a.style.setProperty('--z', p.pos.z);
      a.style.setProperty('--c1', p.colores[0]);
      a.style.setProperty('--c2', p.colores[1] || p.colores[0]);
      if (p.colores[2]) a.style.setProperty('--c3', p.colores[2]);
      a.style.animationDelay = (1.2 + i * 0.11) + 's';
      a.innerHTML =
        '<span class="firma"></span>' +
        (p.ascii ? '<pre class="ascii" aria-hidden="true">' + tejerRosas(3, 3) + '</pre>' : '') +
        '<span class="proy-tit">' + p.titulo + '</span>' +
        '<span class="proy-meta">' + p.anio + '</span>' +
        '<span class="proy-linea">' + p.linea + '</span>';
      a.addEventListener('click', function (e) {
        e.preventDefault();
        if (p.abierto) abrir(p);
      });
      campo.appendChild(a);
    });
    $('#cuenta').textContent = lista.length + ' proyectos';
  }

  /* ── el espacio se mueve con el puntero ── */
  var objetivo = { x: 0, y: 0 }, actual = { x: 0, y: 0 };
  if (window.matchMedia('(min-width: 761px)').matches &&
      !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    window.addEventListener('pointermove', function (e) {
      objetivo.x = (e.clientX / window.innerWidth - 0.5) * -34;
      objetivo.y = (e.clientY / window.innerHeight - 0.5) * -22;
    });
    (function seguir() {
      actual.x += (objetivo.x - actual.x) * 0.045;
      actual.y += (objetivo.y - actual.y) * 0.045;
      campo.style.transform = 'translate3d(' + actual.x + 'px,' + actual.y + 'px,0)';
      requestAnimationFrame(seguir);
    })();
  }

  /* ── leer un proyecto ── */
  function abrir(p) {
    var c = $('#l-cuerpo');
    var etapas = (p.etapas || []).map(function (e) {
      return '<section class="l-etapa"><h2>' + e.nombre + '</h2><div class="l-imgs">' +
        e.imgs.map(function (f) {
          return '<img src="obra/' + p.id + '/' + f + '" alt="' + p.titulo + '" loading="lazy">';
        }).join('') + '</div></section>';
    }).join('');
    c.innerHTML =
      '<header class="l-cab">' +
        '<span class="l-anio">' + p.anio + '</span>' +
        '<h1 class="l-tit">' + p.titulo + '</h1>' +
        '<p class="l-linea">' + p.linea + '</p>' +
      '</header>' +
      '<div class="l-paleta">' + p.colores.map(function (col) {
        return '<i style="background:' + col + '"></i>';
      }).join('') + '</div>' +
      (p.texto ? '<div class="l-texto">' + p.texto + '</div>' : '') +
      etapas +
      '<div class="l-pie">Adriano Lenaz Zenteno · ADRIP · Cochabamba</div>';
    c.style.setProperty('--c1', p.colores[0]);
    c.style.setProperty('--c2', p.colores[1] || p.colores[0]);
    var l = $('#lectura');
    l.classList.add('abierta');
    l.setAttribute('aria-hidden', 'false');
    l.scrollTop = 0;
    document.body.classList.add('leyendo');
    if (history.replaceState) history.replaceState(null, '', '#' + p.id);
    c.querySelectorAll('.l-imgs img').forEach(function (im) {
      im.addEventListener('click', function () {
        $('#visor-img').src = im.src;
        $('#visor').classList.add('abierto');
      });
    });
  }

  function cerrar() {
    $('#lectura').classList.remove('abierta');
    $('#lectura').setAttribute('aria-hidden', 'true');
    document.body.classList.remove('leyendo');
    if (history.replaceState) history.replaceState(null, '', location.pathname);
  }
  $('#l-cerrar').addEventListener('click', cerrar);
  $('#visor').addEventListener('click', function () { $('#visor').classList.remove('abierto'); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if ($('#visor').classList.contains('abierto')) $('#visor').classList.remove('abierto');
    else if ($('#lectura').classList.contains('abierta')) cerrar();
  });

  /* ── lo que no figura ── */
  var CLAVE = '1312', tecleado = '';
  function revelar() {
    var p = PROYECTOS.find(function (x) { return x.oculto && !x.revelado; });
    if (!p) return;
    p.revelado = true;
    pintarCampo();
    var el = campo.querySelector('[data-id="' + p.id + '"]');
    if (el) { el.style.animationDelay = '0s'; }
  }
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey || e.key.length !== 1) return;
    tecleado = (tecleado + e.key).slice(-CLAVE.length);
    if (tecleado === CLAVE) { tecleado = ''; revelar(); }
  });

  /* ── arranque ── */
  pintarCampo();
  var hash = location.hash.replace('#', '');
  if (hash === CLAVE) revelar();
  else if (hash) {
    var p = PROYECTOS.find(function (x) { return x.id === hash && x.abierto; });
    if (p) setTimeout(function () { abrir(p); }, 1300);
  }
})();
</script>
</body>
</html>
